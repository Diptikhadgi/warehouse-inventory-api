<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warehouse Inventory Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>📦 Warehouse Inventory</h1>
      <p>Real-time stock tracking dashboard</p>
    </div>
    <button class="btn primary" id="addBtn">+ Add Product</button>
  </header>

  <main>
    <section class="cards">
      <div class="card"><span>Total Products</span><h2 id="statProducts">0</h2></div>
      <div class="card"><span>Total Units in Stock</span><h2 id="statUnits">0</h2></div>
      <div class="card warn"><span>Low Stock Items</span><h2 id="statLow">0</h2></div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <input type="text" id="search" placeholder="Search by name or SKU...">
        <label><input type="checkbox" id="lowOnly"> Low stock only</label>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Product</th><th>SKU</th><th>Rack</th><th>Qty</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="productBody"></tbody>
        </table>
      </div>
    </section>

    <section class="grid2">
      <div class="panel">
        <h3>Stock Levels</h3>
        <div class="chart-box"><canvas id="stockChart"></canvas></div>
      </div>
      <div class="panel">
        <h3>Recent Movements</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Product</th><th>Type</th><th>Qty</th><th>Time</th></tr></thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- Add / Edit popup -->
  <dialog id="productDialog">
    <h3 id="productTitle">Add Product</h3>
    <form id="productForm">
      <input type="hidden" id="pId">
      <div class="field"><label>Product Name</label><input id="pName" required></div>
      <div class="field"><label>SKU</label><input id="pSku" required></div>
      <div class="row">
        <div class="field"><label>Quantity</label><input type="number" id="pQty" min="0" value="0"></div>
        <div class="field"><label>Min Stock Alert</label><input type="number" id="pMin" min="0" value="10"></div>
      </div>
      <div class="field"><label>Rack Location</label><input id="pRack" placeholder="e.g. A1"></div>
      <div class="dialog-actions">
        <button type="button" class="btn" id="cancelProduct">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Stock IN / OUT popup -->
  <dialog id="stockDialog">
    <h3 id="stockTitle"></h3>
    <form id="stockForm">
      <div class="field"><label>Quantity</label><input type="number" id="sQty" min="1" required></div>
      <div class="dialog-actions">
        <button type="button" class="btn" id="cancelStock">Cancel</button>
        <button type="submit" class="btn primary">Confirm</button>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
